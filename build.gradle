task runGoogleUploader(type: JavaExec) {
    description = 'Ejecuta la clase GoogleDriveUploader (aseg�rate de haber colocado credentials.json y actualizar la ruta del archivo local en el c�digo)'
    group = 'run'
    classpath = sourceSets.main.runtimeClasspath
    main = 'GoogleDriveUploader'
}

// Tarea para crear un fat-jar (jar con dependencias) para ejecutar sin preocuparse por el classpath
task fatJar(type: Jar) {
    archiveBaseName.set('google-drive-uploader-fat')
    archiveVersion.set('')
    manifest {
        attributes 'Main-Class': 'GoogleDriveUploader'
    }
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}