buildscript {
    repositories {
        jcenter()
        google()
    	mavenCentral() 
    }

    dependencies {
        classpath 'com.bmuschko:gradle-cargo-plugin:2.3'
    }
}

apply plugin: 'com.bmuschko.cargo'

configurations.all {
    resolutionStrategy {
        force 'com.google.guava:guava:30.1-jre'  // Forzar la versi�n jre de guava
    }
}

dependencies {
	implementation 'javax.transaction:javax.transaction-api:1.3'
	implementation 'javax:javaee-api:8.0'	
	
	implementation 'echopointng:echopointng:2.1.0rc4'
	
	
	implementation name:'Echo2_App', ext:'jar'
	implementation name:'Echo2_WebContainer', ext:'jar'
	implementation name:'Echo2_WebRender', ext:'jar'

    // REPORTES ----------------------------------------------------------------------------------                              
        implementation group: 'net.sf.jasperreports', name: 'jasperreports', version: '6.7.1'
        
        implementation group: 'org.apache.poi', name: 'poi', version: '3.15'
        
        implementation group: 'com.lowagie', name: 'itext', version: '2.1.7'
    // FIN ----------------------------------------------------------------------------------

	//implementation group: 'org.hibernate', name: 'hibernate', version: '3.1'
	implementation('org.hibernate:hibernate:3.1') {
        exclude group: 'javax.transaction', module: 'jta'
    }
	
	implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.14.0'

	// GOOGLE API    
    implementation 'com.google.api-client:google-api-client:1.31.5' // Google API Client - antes 2.8.1
    implementation 'com.google.oauth-client:google-oauth-client:1.36.0' // Google OAuth 2.0 Client
    implementation 'com.google.http-client:google-http-client-gson:2.0.0' // Google HTTP Client
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.3'  // Jackson (JSON)
    implementation 'com.google.code.gson:gson:2.11.0' // Gson (para JSON en la API)

    // Dependencias adicionales necesarias para Drive and oauth-jetty
    implementation 'com.google.apis:google-api-services-drive:v3-rev197-1.25.0'       
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.36.0'

    // Guava (necesaria para Preconditions y utilidades usadas por google-api-client)
    implementation 'com.google.guava:guava:30.1-jre'
    
    
}

sourceSets {
    main {
		java {
			// El path correcto deber�a ser 'src/main/java', pero se mantiene 'src' por compatibilidad con el proyecto actual
			srcDirs = ['src']
			//include '**/*.xml'
		}
		resources {
			// Mantener 'src' por compatibilidad con el proyecto actual y a�adir 'src/main/resources'
            srcDirs = ['src', 'src/main/resources']
			//include '*.xml'
		}
	}
}




war {
    from 'WebRoot'
    //webAppDirectory = file('src/main/webapp')
    archiveName ='InmobiliariaApp.war'
    //webInf { from 'WebRoot/WEB-INF' }
